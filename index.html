<!DOCTYPE html>
<html>
<head>
<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
<link href='https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Orbitron:wght@700;900&family=Russo+One&display=swap' rel='stylesheet'>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
body { background: #1a1a1a; overflow: hidden; width: 100%; height: 100%; position: fixed; top: 0; left: 0; font-family: 'Chakra Petch', sans-serif; }

/* ---------------- LOGIN PAGE STYLES ---------------- */
#login-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #0b0f15; z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.login-box {
    background: rgba(0,0,0,0.6); border: 2px solid #ffcc00; border-radius: 20px 5px 20px 5px;
    padding: 30px; text-align: center; box-shadow: 0 0 20px rgba(255,204,0,0.5);
}
.login-title { font-family: 'Russo One', sans-serif; color: #ffcc00; font-size: 22px; margin-bottom: 5px; }
.login-sub { color: #00ff66; font-size: 11px; margin-bottom: 25px; font-family: 'Orbitron'; letter-spacing: 1px; }
.login-input {
    width: 100%; background: rgba(255,255,255,0.1); border: 1px solid #555; border-radius: 8px;
    padding: 12px; color: #fff; font-family: 'Chakra Petch'; font-size: 16px; outline: none; text-align: center;
    margin-bottom: 15px; letter-spacing: 2px;
}
.login-input:focus { border-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.3); }
.login-btn {
    width: 100%; background: linear-gradient(90deg, #00f0ff, #0088ff); color: #000;
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 14px; padding: 12px;
    border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase;
    box-shadow: 0 0 10px rgba(0,240,255,0.5);
}
.login-btn:active { transform: scale(0.95); }
.error-msg { color: #ff3366; font-size: 12px; margin-top: 10px; display: none; font-weight: bold; }

/* ---------------- APP CONTAINER & BACKGROUND ---------------- */
#app-container { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
#bg-iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 1; display: block; }

/* ---------------- FLOATING UI (DRAGGABLE) ---------------- */
#mini, #main { position: absolute; z-index: 1000; touch-action: none; }
#mini { top: 50px; left: 20px; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
#main { top: 15%; left: 50%; transform: translateX(-50%); } /* Initial center position */

/* Floating Logo Style */
@keyframes spinLogo { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes spinLogoRev { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
.spin-ring-1 { position: absolute; width: 60px; height: 60px; border: 2px solid transparent; border-top: 2px solid #ffcc00; border-bottom: 2px solid #e6b800; border-radius: 50%; animation: spinLogo 1.5s linear infinite; z-index: 2; }
.spin-ring-2 { position: absolute; width: 65px; height: 65px; border: 2px solid transparent; border-left: 2px solid #fff5cc; border-right: 2px solid #ffcc00; border-radius: 50%; animation: spinLogoRev 2s linear infinite; z-index: 3; }
#mini img { width: 48px; height: 48px; object-fit: cover; border-radius: 50%; border: 1.5px solid #ffcc00; position: relative; z-index: 4; box-shadow: 0 0 10px rgba(255,204,0,0.8); background: #000; pointer-events: none; }

/* Main Panel Style */
@keyframes breathGlow { 0% { box-shadow: 0 0 15px #ffcc00, inset 0 0 5px rgba(255,204,0,0.3); } 50% { box-shadow: 0 0 25px #ffcc00, inset 0 0 12px rgba(255,204,0,0.5); } 100% { box-shadow: 0 0 15px #ffcc00, inset 0 0 5px rgba(255,204,0,0.3); } }
#main {
    width: 290px; height: 250px; background: #0b0f15;
    border: 2px solid #ffcc00; 
    border-radius: 40px 10px 40px 10px;
    display: none; flex-direction: column; 
    box-shadow: 0 0 15px #ffcc00;
    animation: breathGlow 3s ease-in-out infinite;
    padding: 12px 14px; gap: 8px;
}

/* Glowing Corners */
.corner-dot { position: absolute; width: 5px; height: 5px; background: #fff; border-radius: 50%; box-shadow: 0 0 6px 2px #ffcc00; z-index: 10; }
.cd-tl { top: 14px; left: 14px; } .cd-tr { top: 6px; right: 6px; }
.cd-bl { bottom: 6px; left: 6px; } .cd-br { bottom: 14px; right: 14px; }

/* Header Section */
.header-sec { display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 1px solid rgba(255, 204, 0, 0.15); padding-bottom: 8px; z-index: 5; pointer-events: none; }
.rm-badge { background: #ffcc00; color: #000; font-family: 'Russo One', sans-serif; font-size: 11px; line-height: 1.1; padding: 3px 5px; border-radius: 6px; text-align: center; box-shadow: 0 0 6px rgba(255,204,0,0.8); }
.title-col { flex: 1; margin-left: 10px; display: flex; flex-direction: column; justify-content: center; }
.main-title { font-family: 'Russo One', sans-serif; font-size: 14px; color: #ffcc00; letter-spacing: 1px; text-shadow: 0 0 6px rgba(255, 204, 0, 0.7); line-height: 1.1; }
.sub-title { font-family: 'Chakra Petch', sans-serif; font-size: 9px; color: #00ff66; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px; }
.top-icons { display: flex; gap: 5px; }
.icon-btn { width: 22px; height: 22px; border: 1px solid #ffcc00; border-radius: 5px; display: flex; align-items: center; justify-content: center; background: rgba(255,204,0,0.1); }
.icon-btn svg { width: 12px; height: 12px; fill: #ffcc00; }

/* Mid Section */
#mid-content { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 5; pointer-events: none; }

.mid-sec { display: flex; width: 100%; height: 75px; align-items: center; justify-content: space-between; padding: 0; }
.timer-box { position: relative; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; }
.timer-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); z-index: 1; }
.timer-bg { fill: none; stroke: rgba(255, 204, 0, 0.1); stroke-width: 6; }
.timer-progress { fill: none; stroke: #ffcc00; stroke-width: 6; stroke-dasharray: 283; stroke-dashoffset: 0; stroke-linecap: round; transition: stroke-dashoffset 1s linear; filter: drop-shadow(0 0 4px rgba(255,204,0,0.7)); }
.num-png-wrap { position: absolute; width: 56px; height: 56px; border-radius: 50%; z-index: 2; display: flex; align-items: center; justify-content: center; overflow: hidden; background: rgba(0,0,0,0.4); box-shadow: inset 0 0 8px rgba(255,204,0,0.2); }

.res-details { flex: 1; margin-left: 12px; display: flex; flex-direction: column; justify-content: center; }
.res-row-1 { display: flex; justify-content: space-between; align-items: center; font-size: 9px; color: #cccccc; font-weight: 700; margin-bottom: 4px; }
.profit-tag { border: 1px solid #00ff66; color: #00ff66; padding: 2px 5px; border-radius: 8px; box-shadow: 0 0 4px rgba(0,255,102,0.4); text-shadow: 0 0 3px rgba(0,255,102,0.9); }
.res-row-2 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.big-text { font-family: 'Russo One', sans-serif; font-size: 26px; color: #ffcc00; text-shadow: 0 0 10px rgba(255,204,0,0.7); line-height: 1; }
.color-tag { background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 10px; font-weight: 800; font-size: 10px; font-family: 'Orbitron', sans-serif; }
.prog-container { display: flex; align-items: center; gap: 6px; width: 100%; }
.prog-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
.prog-fill { width: 99.8%; height: 100%; background: #ffcc00; box-shadow: 0 0 4px #ffcc00; }
.prog-text { font-family: 'Orbitron', sans-serif; font-size: 8px; font-weight: 800; color: #ffffff; }

/* FULL-BOX CODING ANIMATION */
.coding-box { position: relative; width: 100%; flex: 1; overflow: hidden; padding: 5px 0; display: flex; flex-direction: column; justify-content: center; }
.laser-bar { position: absolute; left: 0; width: 100%; height: 2px; background: #00f0ff; box-shadow: 0 0 12px 5px rgba(0, 240, 255, 0.7); animation: laserScan 1.2s ease-in-out infinite alternate; z-index: 2; }
@keyframes laserScan { 0% { top: 5%; opacity: 0.9; } 100% { top: 95%; opacity: 0.9; } }

.code-content { display: flex; flex-direction: column; gap: 5px; font-family: 'Chakra Petch', monospace; font-size: 11px; color: #00f0ff; letter-spacing: 0.5px; z-index: 1; padding-left: 5px; }
.c-line { opacity: 0; animation: typeCode 2s forwards; text-shadow: 0 0 5px #00f0ff; }
.c-line:nth-child(1) { animation-delay: 0.2s; }
.c-line:nth-child(2) { animation-delay: 1.2s; }
.c-line:nth-child(3) { animation-delay: 2.2s; }
.c-line:nth-child(4) { animation-delay: 3.2s; }
@keyframes typeCode { 0% { opacity: 0; transform: translateX(-10px); } 100% { opacity: 1; transform: translateX(0); } }

/* Bet / Chips Section */
.bet-sec { background: rgba(0,0,0,0.3); border: 1px solid rgba(255, 204, 0, 0.2); border-radius: 10px; padding: 6px 8px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
.chip-label { font-size: 9px; color: #999; font-weight: 700; margin-right: 4px; }
.chips-row { display: flex; gap: 4px; align-items: center; }
.chip { padding: 2px 6px; border-radius: 8px; font-size: 9px; font-family: 'Orbitron', sans-serif; font-weight: 800; }
.chip-active { background: #ffcc00; color: #000; box-shadow: 0 0 6px rgba(255,204,0,0.7); }
.chip-inactive { border: 1px solid #555; color: #888; }
.bet-info { font-family: 'Russo One', sans-serif; font-size: 9px; color: #fff; text-align: right; line-height: 1.2; }
.bet-info span { font-size: 11px; color: #ffcc00; }

/* Footer Section */
.foot-sec { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 4px; z-index: 5; }
@keyframes blinkDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.ai-status { display: flex; align-items: center; gap: 4px; font-family: 'Orbitron', sans-serif; font-size: 9px; color: #00ff66; font-weight: 800; text-shadow: 0 0 4px rgba(0,255,102,0.7); }
.status-dot { width: 6px; height: 6px; background: #00ff66; border-radius: 50%; box-shadow: 0 0 5px rgba(0,255,102,0.9); animation: blinkDot 1.2s infinite; }

.bot-btns { display: flex; gap: 6px; flex-wrap: nowrap; z-index: 15; pointer-events: auto; }

/* PREMIUM BUTTON ANIMATIONS */
@keyframes shineGradient { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
@keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 8px rgba(0, 240, 255, 0.5); } 50% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.8); } }
.btn-cyan { 
   background: linear-gradient(90deg, #00f0ff, #0088ff, #00f0ff); background-size: 200% auto; 
   color: #000; font-family: 'Orbitron', sans-serif; font-size: 9.5px; font-weight: 900; border: none; border-radius: 6px; 
   padding: 6px 10px; display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; 
   animation: shineGradient 3s linear infinite, pulseGlow 2s infinite; transition: 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); 
}
.btn-cyan svg { width: 11px; height: 11px; fill: #000; transition: transform 0.2s; }
.btn-cyan:active { transform: scale(0.92); filter: brightness(1.2); }
.btn-cyan:active svg { transform: scale(1.1); }

.btn-dark { 
   background: rgba(255,255,255,0.05); border: 1px solid #555; color: #fff; 
   font-family: 'Orbitron', sans-serif; font-size: 9.5px; font-weight: 800; border-radius: 6px; padding: 6px 10px; 
   display: flex; align-items: center; gap: 4px; cursor: pointer; transition: all 0.25s ease; white-space: nowrap; 
}
.btn-dark svg { width: 11px; height: 11px; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: 0.2s; }
.btn-dark:active { transform: scale(0.92); background: rgba(255,255,255,0.2); box-shadow: 0 0 10px rgba(255,255,255,0.4); border-color: #fff; }

/* Scan Anim Background Line */
@keyframes scanLineFx { 0% { left: -100%; } 100% { left: 100%; } }
.scan-fx { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; border-radius: 40px 10px 40px 10px; pointer-events: none; z-index: 1; }
.scan-line { position: absolute; width: 4px; height: 100%; background: #ffcc00; box-shadow: 0 0 20px 8px rgba(255,204,0,0.6); animation: scanLineFx 2s linear infinite; opacity: 0.5; }

</style>

<script>
// --- LOGIN LOGIC ---
function verifyLogin() {
    var pass = document.getElementById("pass-input").value;
    if(pass === "APEX") {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("app-container").style.display = "block";
        document.getElementById('main').style.display = 'none';

    } else {
        document.getElementById("error-txt").style.display = "block";
    }
}

// --- DRAG LOGIC (SMOOTH MOVE WITHOUT SCROLLING BG) ---
function makeDraggable(element, isMini) {
    var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
    var isMoved = false;

    element.onmousedown = dragMouseDown;
    element.ontouchstart = dragMouseDown;

    function dragMouseDown(e) {
        // Prevent drag if clicking on a button inside the tool
        if(e.target.tagName === 'BUTTON' || e.target.closest('.bot-btns')) return;
        
        e = e || window.event;
        isMoved = false;
        
        if (e.type === 'touchstart') {
            pos3 = e.touches[0].clientX;
            pos4 = e.touches[0].clientY;
        } else {
            pos3 = e.clientX;
            pos4 = e.clientY;
        }
        
        document.onmouseup = closeDragElement;
        document.ontouchend = closeDragElement;
        document.onmousemove = elementDrag;
        document.ontouchmove = elementDrag;
    }

    function elementDrag(e) {
        e = e || window.event;
        e.preventDefault(); // Prevents background scrolling during drag
        isMoved = true;
        
        var clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        var clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
        
        pos1 = pos3 - clientX;
        pos2 = pos4 - clientY;
        pos3 = clientX;
        pos4 = clientY;
        
        // Remove transform if dragging main so offset calculation works cleanly
        if(element.id === 'main' && element.style.transform !== "none") {
            element.style.transform = "none";
            element.style.left = element.offsetLeft + "px"; 
        }

        element.style.top = (element.offsetTop - pos2) + "px";
        element.style.left = (element.offsetLeft - pos1) + "px";
    }

    function closeDragElement() {
        document.onmouseup = null;
        document.ontouchend = null;
        document.onmousemove = null;
        document.ontouchmove = null;
        
        // If it was just a tap (not dragged) on the mini logo, open the tool
        if (!isMoved && isMini) {
            openM();
        }
    }
}

    var total = utc.getUTCHours() * 60 + utc.getUTCMinutes() - 1;
    if (total < 0) total = 1439; 
    var periodSuffix = String(10001 + total);
    return periodSuffix.slice(-5);
}
